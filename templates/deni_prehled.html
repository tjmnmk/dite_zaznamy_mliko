<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('favicon') }}">
    <title>Denní přehled kojení</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 16px; background: #f5f5f5; color: #222;
        }
        .container { max-width: 480px; margin: 0 auto; }
        h1 { font-size: 1.4rem; text-align: center; margin: 8px 0 20px; }
        .domu { position: absolute; top: 14px; left: 16px; font-size: 1.5rem; color: #2563eb; text-decoration: none; }
        table {
            width: 100%; border-collapse: collapse; background: #fff;
            border-radius: 8px; overflow: hidden;
        }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #2563eb; color: #fff; font-size: 0.85rem; text-transform: uppercase; }
        tr:last-child td { border-bottom: none; }
        td.den { font-weight: 600; color: #2563eb; }
        td.cislo { text-align: right; font-variant-numeric: tabular-nums; }
        .prazdno { text-align: center; color: #888; margin-top: 40px; }
        .odkaz { display: block; text-align: center; margin-top: 16px; color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <a class="domu" href="{{ url_for('formular') }}" title="Domů">🏠</a>
    <div class="container">
        <h1>📅 Denní přehled</h1>
        {% if not dny %}
            <p class="prazdno">Zatím žádné záznamy.</p>
        {% else %}
            <table>
                <thead>
                    <tr>
                        <th>Den</th>
                        <th class="cislo">Kojení</th>
                        <th class="cislo">Mléko (ml)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for d in dny %}
                    <tr>
                        <td class="den">{{ d.den }}</td>
                        <td class="cislo">{{ d.pocet }}×</td>
                        <td class="cislo">{{ d.celkem }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% endif %}
        <a class="odkaz" href="{{ url_for('formular') }}">← Nový záznam</a>
        <a class="odkaz" href="{{ url_for('prehled') }}">→ Přehled záznamů</a>
        <a class="odkaz" href="{{ url_for('graf') }}">📊 Graf</a>
    </div>
</body>
</html>
