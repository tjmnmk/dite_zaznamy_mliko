<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('favicon') }}">
    <title>Záznam kojení</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
            color: #222;
        }
        .container { max-width: 480px; margin: 0 auto; }
        h1 { font-size: 1.4rem; text-align: center; margin: 8px 0 20px; }
        label { display: block; font-weight: 600; margin: 12px 0 6px; }
        input[type=number] {
            width: 100%; padding: 14px; font-size: 1.2rem;
            border: 2px solid #ccc; border-radius: 8px;
        }
        .checkboxy { margin: 16px 0; }
        .checkboxy label {
            display: flex; align-items: center; gap: 10px;
            font-weight: normal; padding: 12px;
            background: #fff; border-radius: 8px; margin: 8px 0;
            border: 2px solid #eee;
        }
        .checkboxy input { width: 24px; height: 24px; }
        button {
            width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 700;
            background: #2563eb; color: #fff; border: none; border-radius: 8px;
            margin-top: 12px; cursor: pointer;
        }
        button:active { background: #1d4ed8; }
        .ulozeno {
            background: #dcfce7; color: #166534; padding: 12px 14px;
            border-radius: 8px; font-weight: 600; text-align: center;
            margin-bottom: 16px;
        }
        .chyba {
            background: #fee2e2; color: #991b1b; padding: 12px 14px;
            border-radius: 8px; font-weight: 600; text-align: center;
            margin-bottom: 16px;
        }
        input[type=text], input[type=datetime-local] {
            width: 100%; padding: 14px; font-size: 1.2rem;
            border: 2px solid #ccc; border-radius: 8px;
        }
        .hlava-slider { margin: 16px 0; background: #fff; border-radius: 8px; padding: 12px; border: 2px solid #eee; }
        .hlava-slider label { margin: 0 0 8px; }
        .hlava-slider .stupnice { display: flex; justify-content: space-between; font-size: 0.85rem; color: #666; margin-top: 4px; }
        .hlava-slider input[type=range] { width: 100%; accent-color: #2563eb; }
        .odkaz { display: block; text-align: center; margin-top: 16px; color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍼 Záznam kojení</h1>
        {% if ulozeno %}
        <div class="ulozeno">✓ Záznam uložen</div>
        {% endif %}
        {% if chyba %}
        <div class="chyba">⚠ {{ chyba }}</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="cas">Čas</label>
            <input type="datetime-local" id="cas" name="cas" value="{{ aktualni_cas }}">

            <label for="mnozstvi">Množství mléka (ml)</label>
            <input type="number" id="mnozstvi" name="mnozstvi" min="0" value="{{ predvyplneno }}" required>

            <div class="hlava-slider">
                <label for="pozice_hlavy">Pozice hlavy <span style="font-weight:normal; font-size:0.8rem; color:#666;">(z pohledu rodiče)</span></label>
                <input type="range" id="pozice_hlavy" name="pozice_hlavy" min="0" max="10" value="5">
                <div class="stupnice"><span>← levá (0)</span><span id="hlava_hodnota">5</span><span>pravá (10) →</span></div>
                <label style="font-weight:normal; font-size:0.85rem; display:flex; align-items:center; gap:8px; margin-top:8px;">
                    <input type="checkbox" id="hlava_neznama" onchange="
                        const s = document.getElementById('pozice_hlavy');
                        const h = document.getElementById('hlava_hodnota');
                        if (this.checked) { s.disabled = true; h.textContent = '—'; }
                        else { s.disabled = false; h.textContent = s.value; }
                    "> pozice hlavy nezaznamenána
                </label>
            </div>

            <div class="checkboxy">
                <label><input type="checkbox" name="stolice"> Stolice</label>
                <label><input type="checkbox" name="moc"> Moč</label>
                <label><input type="checkbox" name="zvraceni"> Zvracení</label>
            </div>

            <label for="poznamka">Poznámka</label>
            <textarea id="poznamka" name="poznamka" rows="2" style="width:100%; padding:14px; font-size:1rem; border:2px solid #ccc; border-radius:8px; resize:vertical;"></textarea>

            <button type="submit">Uložit</button>
        </form>
        <a class="odkaz" href="{{ url_for('prehled') }}">→ Přehled záznamů</a>
        <a class="odkaz" href="{{ url_for('deni_prehled') }}">📅 Denní přehled</a>
        <a class="odkaz" href="{{ url_for('graf') }}">📊 Graf</a>
    </div>
    <script>
        const slider = document.getElementById('pozice_hlavy');
        const hodnota = document.getElementById('hlava_hodnota');
        const neznama = document.getElementById('hlava_neznama');
        slider.addEventListener('input', () => { if (!slider.disabled) hodnota.textContent = slider.value; });
        neznama.addEventListener('change', () => {
            if (neznama.checked) {
                slider.disabled = true;
                hodnota.textContent = '—';
            } else {
                slider.disabled = false;
                hodnota.textContent = slider.value;
            }
        });
        // Pri odeslani formulare: pokud je "nezaznamenano", vymaz hodnotu
        document.querySelector('form').addEventListener('submit', () => {
            if (neznama.checked) {
                slider.removeAttribute('name');
            }
        });
    </script>
</body>
</html>
